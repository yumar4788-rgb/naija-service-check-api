<style>

:root[data-theme="dark"]{--bg:#10141c;--soft:#1a202b;--ink:#eef1f5;--mut:#a5afbf;--blue:#7aa7ff;--green:#4cc88a;--line:#2d3544;--card:#161c26;--amb:#f0a63a;--red:#ff8a80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:18px;color:var(--blue);letter-spacing:.3px}.logo small{display:block;font-weight:500;font-size:12px;color:var(--mut);letter-spacing:0}

.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px 20px;font:700 16px system-ui;cursor:pointer;min-height:48px}
:root:not([data-theme="light"]) .btn{color:#10141c}.btn.g{background:var(--green)}.btn.o{background:none;color:var(--blue);border:2px solid var(--blue)}

main{max-width:980px;margin:0 auto;padding:20px 16px}
h1{font-size:32px;line-height:1.15;margin:.2em 0}h2{font-size:24px;margin:1.4em 0 .4em}h3{font-size:19px;margin:.2em 0}
.mut{color:var(--mut)}.hero{text-align:center;padding:14px 0}.tag{color:var(--green);font-weight:700}
.sb{display:flex;gap:8px;margin:14px 0 6px}.sb input,.f input{flex:1;font:inherit;font-size:18px;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0;width:100%}
.ex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}.chip{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.card .ic{font-size:28px}.card p{margin:.2em 0;color:var(--mut);font-size:15px}.card b.go{color:var(--blue);font-size:15px}
.vband{background:var(--soft);border:2px solid var(--blue);border-radius:16px;padding:16px;margin-top:22px}
.banner{font-weight:800;color:var(--blue);font-size:20px;text-align:center;margin:22px 0 0}
.res{border-radius:14px;border:2px solid var(--line);padding:16px;margin:14px 0;background:var(--card)}
.st{display:inline-block;font-weight:800;padding:4px 10px;border-radius:8px;font-size:15px;border:2px solid currentColor}
.green{color:var(--green)}.blue{color:var(--blue)}.amb{color:var(--amb)}.red{color:var(--red)}.ora{color:var(--amb)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:16px;margin:10px 0}.kv span:nth-child(odd){color:var(--mut)}
.dest{border:2px solid var(--green);border-radius:14px;padding:14px;margin:12px 0}
.disc,footer{font-size:14px;color:var(--mut);border-top:1px solid var(--line);margin-top:28px;padding-top:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
:root:not([data-theme="light"]) .tabs .chip.on{color:#10141c}
.f{display:grid;gap:10px;margin:10px 0}.f label{font-weight:700;font-size:16px}
ol.steps{padding-left:22px}ol.steps li{margin:6px 0}.chk{list-style:none;padding:0}.chk li:before{content:"☑ "}
nav.bot{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav.bot a{display:flex;flex-direction:column;align-items:center;font-size:12px;padding:4px 8px;color:var(--mut)}nav.bot a span{font-size:22px}nav.bot a.on{color:var(--blue)}
nav.bot a.v{background:var(--green);color:#fff;border-radius:14px;padding:6px 16px;margin-top:-18px;box-shadow:0 2px 6px #0004}
.fl a{color:var(--blue);font-weight:600}details{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--card)}summary{font-weight:700;cursor:pointer}.hide{display:none}.demo{background:var(--soft);border-left:4px solid var(--amb);padding:8px 12px;font-size:14px;border-radius:6px}
@media(min-width:760px){nav.top{display:flex}nav.bot{display:none}body{padding-bottom:0}h1{font-size:48px}}

h+=stBadge(k)+'<div class="kv"><span>Claim checked</span><span>'+esc(r.claim||'')+'</span><span>Authoritative source</span><span>'+esc((r.source||{}).name||'Not stated')+'</span><span>Last checked</span><span>'+esc(r.lastChecked||'unknown')+'</span></div>';
if(r.stale)h+='<div class="demo">This information may need to be refreshed.</div>';

if(k==='o'&&!(r.matches||[]).length)h+='<p><b>We couldn\'t find a matching official record.</b> This does not automatically mean it is fake.</p>';
return h+(r.source?link(r.source):'')+'</div>'}

var SAMPLES=[{status:'g',claim:'Recruitment notice',source:{name:'Sample agency',url:'https://example.org'},lastChecked:'04 Oct 2026',matches:['Vacancy listed on agency careers page','Application link on official domain'],mismatches:[],summary:'The vacancy is published by the organisation itself.'},{status:'b',claim:'ABC Nigeria Ltd',source:{name:'CAC',url:'https://example.org'},lastChecked:'04 Oct 2026',fields:{'Registration number':'RC 000000','Status':'as reported by CAC'},matches:['Name','Registration number'],mismatches:[],summary:'A matching record exists. It does not prove every job, website, product or claim is genuine.'},{status:'y',claim:'Product X',source:{name:'NAFDAC',url:'https://example.org'},lastChecked:'04 Oct 2026',matches:['Registration number found'],mismatches:['Manufacturer name differs'],summary:'Compare the pack with the official record before using it.'},{status:'o',claim:'Unknown Co',lastChecked:'04 Oct 2026',matches:[],mismatches:[],summary:'Not enough authoritative evidence.'},{status:'r',claim:'recruit-ng.example',source:{name:'Sample agency',url:'https://example.org'},lastChecked:'04 Oct 2026',matches:[],mismatches:['Domain differs from official domain'],summary:'The organisation has warned about this claim. Do not pay or share personal data.'},{error:'unavailable',source:{url:'https://example.org'}},{candidates:[{id:'1',label:'ABC Ltd, Rivers'},{id:'2',label:'ABC Ltd, Lagos'}]}];

var ST={g:['🟢','OFFICIALLY VERIFIED','green','Strong authoritative evidence supports the claim.'],b:['🔵','REGISTERED / RECORD FOUND','blue','The item exists in an authoritative record. This does not prove every associated claim.'],y:['🟡','PARTIALLY VERIFIED','amb','Some information matches, but the particular claim cannot be completely established.'],o:['🟠','UNABLE TO VERIFY','ora','There is not enough authoritative evidence. This does not automatically mean it is fake.'],r:['🔴','OFFICIAL WARNING','red','An authoritative organisation has issued a warning or contradiction about this claim.']};

var V={
faq:function(){return '<h1>Frequently asked questions</h1><details><summary>Is Naija Service Check a government website?</summary><p>No. We are an independent information and verification platform. We do not process applications, take payments for government services or issue documents.</p></details><details><summary>Do I need an account?</summary><p>No. Searching, reading service information and running checks need no sign-up.</p></details><details><summary>Does &quot;record found&quot; mean a company, product or job is genuine?</summary><p>No. It only means a matching entry exists in an authoritative record. It does not prove every claim, job, website or product made by that organisation.</p></details><details><summary>What if you find no match?</summary><p>It does not automatically mean something is fake. Our records may be incomplete or out of date. Check the official source yourself before you pay or share information.</p></details><details><summary>Where does your information come from?</summary><p>From official sources, entered and reviewed by our team, with the source link and date checked shown on each result. Records are reviewed regularly because government information changes.</p></details><details><summary>Do real employers ask applicants to pay?</summary><p>Genuine recruiters do not charge applicants. Never pay, and never share your NIN, BVN, OTP, password or card details in response to a job message.</p></details><details><summary>A fee on a service page looks different from what an agent asked. Why?</summary><p>We show the official government fee separately from possible third-party charges. Agents may add their own fees, which are not government fees.</p></details><details><summary>How do I report a scam or correct a record?</summary><p>Use the Contact page. For scams, also report to the organisation concerned and the relevant authority.</p></details><details><summary>Can I rely on your results as legal or financial advice?</summary><p>No. They are general information to help you find and compare with official sources.</p></details>'+disc()},
contact:function(){return '<h1>Contact us</h1><p>Use this page to report a scam, ask for a correction to a record, or send feedback.</p><div class="res"><div class="kv"><span>Email</span><span>[add your contact email]</span><span>WhatsApp</span><span>[add your number]</span><span>Response time</span><span>[state your target, e.g. 3 working days]</span></div></div><h3>When you write, include</h3><ul><li>The website, company, job or NAFDAC number concerned</li><li>Where you saw it (WhatsApp, Facebook, email, etc.)</li><li>A link or screenshot, if you have one</li></ul><p><b>Please do not send</b> your NIN, BVN, passwords, OTPs or card numbers. We will never ask for them.</p>'+disc()},
privacy:function(){return '<h1>Privacy Notice</h1><p class="mut">Draft for review by a Nigerian data-protection lawyer before launch. Aligned to the Nigeria Data Protection Act 2023.</p><h3>What we collect</h3><ul><li>What you type into Search and Verify (a company name, website, message or number), the time, and the type of check, so we can return a result and improve the service.</li><li>Messages you send through the Contact page.</li></ul><h3>What we do not ask for</h3><p>No account is needed for basic use. Please do not type your NIN, BVN, OTP, password or card details into any box.</p><h3>How we use it</h3><p>To give you a result, to find and fix errors, to spot new scam patterns and to keep the service secure. We do not sell your data.</p><h3>Sharing</h3><p>We may share information with hosting providers who run the service, or where the law requires it.</p><h3>Retention and your rights</h3><p>We keep logs only as long as needed for these purposes ([state period]). You may ask us to access, correct or delete your information through the Contact page.</p><h3>Cookies</h3><p>[State whether you use analytics or cookies. The basic site does not set any.]</p>'+disc()},
terms:function(){return '<h1>Terms of Use</h1><p class="mut">Draft for review by a Nigerian lawyer before launch.</p><ol class="steps"><li><b>Independent service.</b> Naija Service Check is not a government agency and does not process applications or payments for government services.</li><li><b>Information only.</b> Results show what our records and listed sources say on the date checked. They are not legal, financial or professional advice.</li><li><b>No guarantee.</b> A record found does not prove a company, job, website or product is genuine. No match does not prove it is fake. Always compare with the official source before you apply, buy or pay.</li><li><b>Accuracy.</b> Government information changes. We work to keep records current but cannot promise they are complete or up to date.</li><li><b>Your responsibility.</b> You decide what to do with the information. Do not rely on this site alone for important decisions.</li><li><b>Acceptable use.</b> Do not misuse the service, attempt to disrupt it, or submit false reports about organisations.</li><li><b>Third-party links.</b> We link to official and other sites we do not control.</li><li><b>Changes.</b> We may update these terms. Continued use means you accept the updated terms.</li></ol>'+disc()},
states:function(){return '<h1>Result screens</h1><p class="mut">Sample data in the exact format the backend returns. See api-contract.md.</p>'+SAMPLES.map(render).join('')+disc()},
find:function(a){var h='<h1>Help me find the right service</h1><p class="mut">You do not need to know which agency. Just tell us what you want to do.</p>';
if(!a){h+='<div class="grid">'+Object.keys(FIND).map(function(k){return '<button class="card" data-fa="'+k+'"><h3>'+k+'</h3><b class="go">NEXT →</b></button>'}).join('')+'</div><h2>Not sure? Type it in your own words</h2><form class="sb" id="sf"><input id="q" aria-label="Describe what you need" placeholder="e.g. my child needs an ID"><button class="btn">SEARCH</button></form>'}
else{h+='<p><button class="chip" data-v="find">← Back</button></p><h2>'+a+': which one?</h2><div class="grid">'+FIND[a].map(function(x){return '<button class="card" data-svc="'+x[1]+'"><h3>'+x[0]+'</h3><b class="go">SEE OFFICIAL ROUTE →</b></button>'}).join('')+'</div>'}
return h+disc()},
home:function(){return '<section class="hero"><h1>What are you trying to do?</h1><p><button class="btn g" data-v="find">HELP ME FIND THE RIGHT SERVICE</button></p><p class="mut">Find the correct Nigerian government service, understand what you need and get the official route.</p>'+
'<form class="sb" id="sf" role="search"><input id="q" aria-label="Search for a service" placeholder="🔎 '+PH[0]+'"><button class="btn">SEARCH</button></form>'+
'<p class="mut">You can search using normal everyday language.</p><div class="ex">'+["How do I register a business?","I need a passport.","Is this job advert real?","Check this NAFDAC number."].map(function(x){return '<button class="chip" data-q="'+x+'">'+x+'</button>'}).join('')+'</div></section>'+
'<div class="vband"><h2 style="margin-top:0">🛡️ VERIFY BEFORE YOU APPLY, BUY OR PAY</h2><p>Received a job advert, website, product number or company name? Check it against authoritative information before you trust it.</p><div class="grid">'+
[['company','🏢','VERIFY A COMPANY','Check whether an organisation exists and view registration information.'],['job','💼','VERIFY A JOB','Check whether a recruitment opportunity can be independently confirmed.'],['site','🌐','VERIFY A WEBSITE','Is this website really tied to the organisation it claims to represent?'],['nafdac','💊','VERIFY A NAFDAC PRODUCT','Compare a registration number with NAFDAC records.']].map(function(c){return '<button class="card" data-vt="'+c[0]+'"><div class="ic">'+c[1]+'</div><h3>'+c[2]+'</h3><p>'+c[3]+'</p><b class="go">VERIFY NOW →</b></button>'}).join('')+'</div></div>'+
'<h2>Popular Services</h2><div class="grid">'+S.map(svcCard).join('')+'</div><p><button class="btn o" data-v="services">VIEW ALL SERVICES</button></p>'+

'<div class="banner">BEFORE YOU APPLY, BUY OR PAY — CHECK.</div>'+disc()},
services:function(){return '<h1>Government Services</h1><p class="mut">Organised by what you need to do, not by ministry.</p><div class="tabs">'+CATS.map(function(c){return '<span class="chip">'+c+'</span>'}).join('')+'</div><div class="grid">'+S.map(svcCard).join('')+'</div>'+disc()},
verify:function(t){t=t||'company';var T={company:['Verify a Nigerian Company or Organisation','Company / Organisation Name'],job:['Verify a job before you apply','Paste job link, message or organisation name'],site:['Is this the real website?','Paste website address'],nafdac:['Verify a NAFDAC product','NAFDAC Registration Number'],reg:['Verify a regulated organisation','Organisation name']};
return '<h1>🛡️ Verify before you act</h1><div class="tabs" role="tablist">'+[['company','Company'],['job','Job'],['site','Website'],['nafdac','NAFDAC'],['reg','Regulated org']].map(function(x){return '<button class="chip'+(x[0]==t?' on':'')+'" data-vt="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'+
'<h2 style="margin-top:6px">'+T[t][0]+'</h2><form class="f" id="vf" data-t="'+t+'"><label for="vi">'+T[t][1]+'</label><input id="vi" required>'+(t=='job'?'<label><input type="checkbox" id="pay" style="width:auto"> The advert asks me to pay money</label>':'')+'<button class="btn g">VERIFY</button></form><div id="vr"></div>'+
'<div class="res"><h3>What should I do if it looks suspicious?</h3><ol class="steps"><li>Do not pay.</li><li>Do not share your NIN, BVN, OTP, password or card details.</li><li>Find the organisation through its own official website.</li><li>Use only the application channel linked there.</li></ol></div>'+disc()},
alerts:function(){return '<h1>⚠️ Naija Service Check Alerts</h1><p class="mut">Only warnings published by the organisation concerned. Rumours are not shown as facts.</p><div class="res"><span class="st red">🔴 OFFICIAL WARNING</span><h3>Fake Recruitment Website Alert</h3><div class="kv"><span>Organisation</span><span>Sample agency</span><span>Date</span><span>04 October 2026</span><span>Type</span><span>Fake recruitment website</span><span>What to do</span><span>Use only the recruitment channel linked from the organisation\'s own website.</span></div><div class="demo">Sample content for the design prototype. Real alerts will link to the official warning.</div></div>'+disc()},
about:function(){return '<h1>About this platform</h1><p>We help you find the right official source and check whether what you are dealing with can be trusted. We say "official record found" or "unable to verify", never "guaranteed genuine".</p><div class="res"><p><button class="chip" data-v="faq">FAQ</button> <button class="chip" data-v="contact">Contact</button> <button class="chip" data-v="privacy">Privacy</button> <button class="chip" data-v="terms">Terms</button> <button class="chip" data-v="states">Preview result screens</button></p><h3>Every result shows</h3><ol class="steps"><li>The claim checked</li><li>The authoritative source</li><li>What matched, and what did not</li><li>When it was last verified</li><li>A link to inspect the source yourself</li></ol></div>'+disc()}};
function svcPage(id){var s=S.filter(function(x){return x.id==id})[0];return '<p><button class="chip" data-v="services">← Services</button></p><h1>'+s.n+'</h1><p><b>Authority:</b> '+s.a+'</p><span class="st green">✅ Official source identified</span>'+
'<h2>What do I need?</h2><ul class="chk"><li>Valid identification</li><li>Required photographs or details</li><li>Supporting documentation</li></ul><h2>How much does it cost?</h2><p><b>Official government fee:</b> shown from the agency\'s own fee page.<br><b>Possible third-party charges:</b> agents may add fees. These are not government fees.</p>'+
'<h2>How does it work?</h2><ol class="steps"><li>Start application</li><li>Submit required information</li><li>Make official payment</li><li>Attend any required appointment</li><li>Receive or collect your document</li></ol>'+
'<div class="dest"><h3>✅ OFFICIAL DESTINATION</h3><div class="kv"><span>Organisation</span><span>'+s.a+'</span><span>Official domain</span><span>to be confirmed by admin</span><span>Last verified</span><span>pending</span></div><button class="btn g" disabled>GO TO OFFICIAL WEBSITE</button></div><div class="demo">Prototype: fees, documents and domains are placeholders until verified by the admin team.</div>'+disc()}
function results(q){var w=q.toLowerCase().split(/\W+/).filter(function(x){return x.length>2}),sc=S.map(function(s){var n=0;w.forEach(function(x){if(s.k.indexOf(x)>-1)n++});return[n,s]}).filter(function(x){return x[0]}).sort(function(a,b){return b[0]-a[0]});
var amb=/regist/.test(q.toLowerCase())&&/(company|business)/.test(q.toLowerCase());
var h='<h1>You may be looking for:</h1><p class="mut">“'+esc(q)+'”</p>';
if(amb)h+='<h2>Which one are you trying to register?</h2><div class="grid">'+['Business Name','Limited Company','NGO / Incorporated Trustee'].map(function(x){return '<button class="card" data-svc="biz"><h3>'+x+'</h3><p>Authority: CAC</p></button>'}).join('')+'</div>';
else if(sc.length)h+='<div class="grid">'+sc.map(function(x){return svcCard(x[1])}).join('')+'</div>';
else h+='<div class="res"><b>We couldn\'t find a matching service.</b><p>Try different words, or browse all services.</p><button class="btn o" data-v="services">Browse services</button></div>';
return h+disc()}
function hand(k,val,msg,L){return '<div class="res" role="status"><h3>Next: check the official record</h3>'+stBadge(k)+'<div class="kv"><span>Claim checked</span><span>'+esc(val)+'</span><span>What this means</span><span>'+msg+'</span></div><p>'+L.map(function(x){return '<a class="btn g" style="display:inline-block;margin:4px 6px 4px 0;text-decoration:none" target="_blank" rel="noopener" href="'+x[1]+'">'+x[0]+'</a>'}).join('')+'</p><div class="demo">An unlisted or unmatched number does not automatically mean a product or company is fake. A match does not prove every claim is genuine.</div></div>'}
function vres(t,val,pay){var k='o',msg='';var v=val.toLowerCase();
if(t=='site'){var gov=/\.gov\.ng(\/|$)/.test(v);k=gov?'y':'o';msg=gov?'The address ends in .gov.ng, a pattern used by government bodies. Confirm it by following a link from the agency\'s known official site.':'This address does not use a .gov.ng domain. Do not enter personal or payment information until you reach it from the organisation\'s official website.'}
else if(t=='job'){if(pay){k='r';msg='Legitimate recruiters do not ask applicants to pay. Treat this as high risk and do not pay.'}else{k='o';msg='We could not independently confirm this vacancy. Look for it on the organisation\'s own careers page.'}}
else if(t=='nafdac'){k='o';msg='We cannot read NAFDAC records from this page. Search the number on the NAFDAC Greenbook (drugs) or check current NAFDAC alerts. Also use the scratch-code check on the pack where available.';return hand(k,val,msg,[['OPEN NAFDAC GREENBOOK','https://greenbook.nafdac.gov.ng/'],['VIEW NAFDAC ALERTS','https://nafdac.gov.ng/category/recalls-and-alerts/']])}
else if(0){var ok=/^[a-z0-9]{1,2}-?\d{4,6}$/i.test(val.trim());k=ok?'y':'o';msg=ok?'The format looks like a NAFDAC number. The live NAFDAC record lookup is not connected in this prototype.':'This does not look like a typical NAFDAC number. Check the number printed on the pack.'}
else{k='o';msg='We cannot read CAC records from this page. Open the CAC website, use its public search for this name or RC number, and compare the status and registered details.';return hand(k,val,msg,[['OPEN CAC WEBSITE','https://www.cac.gov.ng/']])}
return '<div class="res" role="status"><h3>Result</h3>'+stBadge(k)+'<div class="kv"><span>Claim checked</span><span>'+esc(val)+'</span><span>What this means</span><span>'+msg+'</span><span>Last checked</span><span>04 Oct 2026</span></div><div class="demo">Prototype logic only. A matching number never proves a physical product or every claim is genuine.</div></div>'}
function show(v,a){cur=v;var m=$('#m');m.innerHTML=v=='svc'?svcPage(a):v=='res'?results(a):V[v](a);document.querySelectorAll('[data-v]').forEach(function(e){e.classList.toggle('on',e.dataset.v==(v=='svc'||v=='res'?'services':v))});window.scrollTo(0,0);m.focus();
var q=$('#q');if(q)setInterval(function(){phI=(phI+1)%PH.length;if($('#q'))$('#q').placeholder='🔎 '+PH[phI]},3000)}
document.addEventListener('click',function(e){var t=e.target.closest('[data-v],[data-pick],[data-fa],[data-svc],[data-q],[data-vt],[data-f]');if(!t)return;var d=t.dataset;if(t.tagName=='A')e.preventDefault();
if(d.pick){lookup(window.LAST.t,window.LAST.v,'id='+d.pick).then(function(r){$('#vr').innerHTML=render(r)});return}if(d.v)show(d.v);else if(d.svc)show('svc',d.svc);else if(d.q)show('res',d.q);else if(d.fa)show('find',d.fa);else if(d.vt)show('verify',d.vt);
else if(d.f){var map={'Get a document':['passport','nin','frsc'],'Start a business':['biz','tax'],'Find a job':['nysc'],'Go to school':['jamb','nysc']}[d.f];$('#fnd').innerHTML+='<h3>You may be interested in:</h3><div class="grid">'+map.map(function(i){return svcCard(S.filter(function(s){return s.id==i})[0])}).join('')+'</div>'}});
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id=='sf')show('res',$('#q').value||'passport');else if(e.target.id=='vf'){var p=$('#pay'),t=e.target.dataset.t,v=$('#vi').value,o=$('#vr');o.innerHTML='<p role="status">Checking official sources…</p>';
lookup(t,v).then(function(r){o.innerHTML=render(r);window.LAST={t:t,v:v}}).catch(function(er){o.innerHTML=(er==='nocfg'?'':render({error:'unavailable'}))+vres(t,v,p&&p.checked)})}});
